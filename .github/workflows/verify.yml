name: Verify submission

on:
  push:
    branches: [main]
    paths:
      - run_agent.py
      - ping_floyd/**
      - bench/**
      - tests/**
      - Dockerfile
      - requirements.txt
      - .dockerignore
      - .github/workflows/verify.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build contest image within the build limit
        run: timeout 1000s docker build -t ping-floyd:submission .
      - name: Build verification target
        run: timeout 1000s docker build --target bench -t ping-floyd:checks .
      - name: Run Linux regression checks without model access
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=2g \
            --cap-drop ALL --security-opt no-new-privileges \
            --cpus 2 --memory 4g --pids-limit 512 \
            --entrypoint python ping-floyd:checks \
            -m unittest discover -s bench -t /app -p '*checks.py' -q
      - name: Run unchanged independent PR regressions
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=2g \
            --cap-drop ALL --security-opt no-new-privileges \
            --cpus 2 --memory 4g --pids-limit 512 \
            --entrypoint python ping-floyd:checks \
            -m unittest discover -s tests -p 'test_review_*.py' -v
      - name: Verify BUDGET, entrypoints and saved outputs
        run: python3 -m bench.submission_smoke /tmp/ping-floyd-submission-smoke --image ping-floyd:submission --cpus 2
      - name: Check image contents and size
        run: |
          docker run --rm --network none --read-only --entrypoint python ping-floyd:submission -c \
            'from pathlib import Path; import os; assert not Path("/app/bench").exists(); assert not Path("/app/tests").exists(); assert not Path("/app/.env").exists(); assert "LLM_API_KEY" not in os.environ; assert "BUDGET" not in os.environ'
          docker images --format '{{.Repository}}:{{.Tag}} -> {{.Size}}' ping-floyd:submission
          python3 -c 'import json,subprocess; image=json.loads(subprocess.check_output(["docker","image","inspect","ping-floyd:submission"]))[0]; assert image["Size"] < 4_000_000_000'
